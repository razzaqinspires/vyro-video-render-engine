[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "vyro-video-render-engine"
version = "1.2.0"
description = "Rights-aware, demo-isolated vertical video rendering pipeline for VYRO MEDIA content packages."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = ["pydantic>=2.7,<3", "Pillow>=10.4,<12", "typer>=0.12,<1", "rich>=13.7,<15"]
[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
dev = ["pytest>=8,<9", "ruff>=0.5,<1", "mypy>=1.10,<2"]
[project.scripts]
vyro-render = "vyro_video_render_engine.cli:app"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
